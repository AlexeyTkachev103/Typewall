<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quote Wallpaper Generator</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="container">
        <h1>Quote Wallpaper Generator</h1>

        <div class="content">
            <div class="controls">
                <div class="section">
                    <h2>Background</h2>
                    <div class="form-group">
                        <label>Type:</label>
                        <select id="bg-type">
                            <option value="solid">Solid Color</option>
                            <option value="gradient">Gradient</option>
                        </select>
                    </div>

                    <div id="solid-controls">
                        <div class="form-group">
                            <label>Color:</label>
                            <input type="color" id="bg-color" value="#2c3e50">
                        </div>
                    </div>

                    <div id="gradient-controls" style="display: none;">
                        <div class="form-group">
                            <label>Color 1:</label>
                            <input type="color" id="gradient-color1" value="#667eea">
                        </div>
                        <div class="form-group">
                            <label>Color 2:</label>
                            <input type="color" id="gradient-color2" value="#764ba2">
                        </div>
                        <div class="form-group">
                            <label>Type:</label>
                            <select id="gradient-type">
                                <option value="linear">Linear</option>
                                <option value="radial">Radial</option>
                            </select>
                        </div>
                        <div class="form-group" id="gradient-direction-group">
                            <label>Direction:</label>
                            <select id="gradient-direction">
                                <option value="horizontal">Horizontal</option>
                                <option value="vertical">Vertical</option>
                                <option value="diagonal-tl-br">Diagonal (TL-BR)</option>
                                <option value="diagonal-tr-bl">Diagonal (TR-BL)</option>
                            </select>
                        </div>
                    </div>
                </div>

                <div class="section">
                    <h2>Resolution</h2>
                    <div class="form-group">
                        <label>Preset:</label>
                        <select id="resolution-preset">
                            <option value="800x600">800 × 600</option>
                            <option value="1024x768">1024 × 768</option>
                            <option value="1920x1080" selected>1920 × 1080</option>
                            <option value="2560x1440">2560 × 1440</option>
                            <option value="3840x2160">3840 × 2160 (4K)</option>
                            <option value="custom">Custom</option>
                        </select>
                    </div>
                    <div id="custom-resolution" style="display: none;">
                        <div class="form-group inline">
                            <label>Width:</label>
                            <input type="number" id="custom-width" value="1920" min="100">
                        </div>
                        <div class="form-group inline">
                            <label>Height:</label>
                            <input type="number" id="custom-height" value="1080" min="100">
                        </div>
                    </div>
                </div>

                <div class="section">
                    <div class="section-header">
                        <h2>Text Blocks</h2>
                        <button id="add-text-block" class="add-btn">+ Add Text Block</button>
                    </div>
                    <div id="text-blocks-container"></div>
                </div>

                <div class="section">
                    <h2>Export</h2>
                    <div class="form-group">
                        <label>Format:</label>
                        <select id="export-format">
                            <option value="png">PNG</option>
                            <option value="jpeg">JPEG</option>
                        </select>
                    </div>
                    <button id="download-btn" class="download-btn">Download Wallpaper</button>
                </div>
            </div>

            <div class="preview-container">
                <h2>Preview</h2>
                <div class="preview">
                    <img id="preview-image" src="" alt="Preview">
                    <div id="loading">Generating preview...</div>
                </div>
            </div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
